<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Live Engineering Streak">
  <defs>
    <linearGradient id="streakGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c20"/>
      <stop offset="100%" stop-color="#121314"/>
    </linearGradient>
    <mask id="flameRingMask">
      <rect width="1200" height="230" fill="white"/>
      <ellipse cx="600" cy="74" rx="16" ry="14" fill="black"/>
    </mask>
  </defs>

  <!-- Container Box matching organization.svg exactly -->
  <rect width="1200" height="230" rx="14" fill="url(#streakGlow)" stroke="#262c33" stroke-width="1.5"/>

  <!-- Left Accent Bar & Title -->
  <rect x="32" y="28" width="5" height="22" rx="2.5" fill="#ff5900"/>
  <text x="50" y="45" fill="#f8f6f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1">LIVE ENGINEERING STREAK / TELEMETRY MONITOR</text>

  <!-- Right Pill Badge -->
  <rect x="1025" y="26" width="142" height="26" rx="13" fill="rgba(255, 89, 0, 0.15)" stroke="rgba(255, 89, 0, 0.4)" stroke-width="1"/>
  <circle cx="1040" cy="39" r="4" fill="#ff5900"/>
  <text x="1053" y="44" fill="#ff5900" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">LIVE STREAK</text>

  <!-- Vertical Divider 1 -->
  <line x1="400" y1="75" x2="400" y2="185" stroke="#262c33" stroke-width="1"/>

  <!-- Column 1: Total Contributions -->
  <text x="215" y="124" fill="#f8f6f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" text-anchor="middle">41</text>
  <text x="215" y="156" fill="#c5c5c5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" text-anchor="middle">TOTAL CONTRIBUTIONS</text>
  <text x="215" y="177" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Dec 11, 2024 — Present · Verified GitHub Telemetry</text>

  <!-- Vertical Divider 2 -->
  <line x1="800" y1="75" x2="800" y2="185" stroke="#262c33" stroke-width="1"/>

  <!-- Column 2: Current Streak (Centerpiece with flame circle) -->
  <g mask="url(#flameRingMask)">
    <circle cx="600" cy="118" r="42" fill="none" stroke="#ff5900" stroke-width="4.5"/>
  </g>
  
  <!-- Fire Icon positioned atop the ring -->
  <g transform="translate(600, 64) scale(1.15)">
    <path d="M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z" fill="#ff5900"/>
  </g>

  <!-- Current Streak Big Number -->
  <text x="600" y="132" fill="#ff5900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" text-anchor="middle">2</text>
  <text x="600" y="180" fill="#ff5900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" text-anchor="middle">CURRENT STREAK</text>
  <text x="600" y="198" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Oct 28 — Oct 29 · Continuous Code Commits</text>

  <!-- Column 3: Longest Streak -->
  <text x="985" y="124" fill="#f8f6f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" text-anchor="middle">2</text>
  <text x="985" y="156" fill="#c5c5c5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" text-anchor="middle">LONGEST STREAK</text>
  <text x="985" y="177" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Sep 12 — Sep 13 · High Velocity Sprint</text>

  <!-- Bottom Metadata Bar -->
  <circle cx="40" cy="211" r="4" fill="#ff5900"/>
  <text x="52" y="215" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Continuous Integration Telemetry · Personal GitHub Engine · Vijaysir0hi</text>
  <text x="1165" y="215" fill="#ff5900" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="end">peakframe.in</text>
</svg>
